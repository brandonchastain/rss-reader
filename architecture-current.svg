<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="680" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="140" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Blazor WASM client</text>
<text x="140" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Static Web Apps, free tier</text>

<rect x="440" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="540" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">155 RSS feeds</text>
<text x="540" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">fetched hourly, 8 at a time</text>

<rect x="40" y="140" width="600" height="210" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="60" y="166" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Container App rss-reader-api</text>
<text x="60" y="184" dominant-baseline="central" font-size="12" fill="#5F5E5A">0.5 vCPU, 1 GiB, one replica, always on</text>

<rect x="60" y="200" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="190" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Kestrel API</text>
<text x="190" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">auth, timeline, search, 500 conns</text>

<rect x="360" y="200" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="490" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Background services</text>
<text x="490" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">scheduler, retention, backup</text>

<rect x="200" y="280" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">SQLite /tmp/storage.db</text>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">WAL, 322 MB, container disk</text>

<rect x="40" y="420" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="180" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Azure Files share /data</text>
<text x="180" y="458" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">DB copy every 15 min, lock, keys</text>

<rect x="360" y="420" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="500" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Blob: Litestream replica</text>
<text x="500" y="458" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">dormant, scaling mode off</text>

<g fill="none" stroke="#5F5E5A" stroke-width="1.5">
<line x1="140" y1="96" x2="140" y2="138" marker-end="url(#arrow)"/>
<line x1="540" y1="198" x2="540" y2="98" marker-end="url(#arrow)"/>
<path d="M190 256 L190 268 L260 268 L260 278" marker-end="url(#arrow)"/>
<path d="M490 256 L490 268 L420 268 L420 278" marker-end="url(#arrow)"/>
<line x1="260" y1="336" x2="260" y2="418" marker-end="url(#arrow)"/>
<path d="M420 336 L420 380 L500 380 L500 418" stroke-dasharray="4 3" stroke-width="0.75"/>
</g>
</svg>
