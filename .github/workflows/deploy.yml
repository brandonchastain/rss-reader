# Build and deploy everything: the ARM template, the backend image, and the
# frontend (Blazor WASM + the Functions API proxy).
#
# Before this existed, deploys ran from a laptop. The template had silently
# stopped being deployable at all, so every change reached production through
# `az containerapp update` -- which replaces the scale block wholesale and drops
# settings the template declares. That drift caused a real outage: cooldownPeriod
# fell to 10s, and KEDA then killed each new revision ~11s into a ~13s boot,
# leaving it ActivationFailed while holding 100% of the traffic.
#
# So: the template is the only thing that writes container app config, and the
# image tag is passed into it rather than set behind its back.
#
# Auth is OIDC via the gh-actions-rss-reader user-assigned managed identity. The
# federated credentials must match the subject each job presents -- a pull
# request, a push to main, and an `environment:` job each present a different
# one, and a missing credential fails only that job.
#
# Repo configuration:
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID   (identifiers)
#   GATEWAY_SECRET_KEY                                          (the retired proxy's secret; safe to delete once the SWA header scheme is removed)
#   AUTH_{GOOGLE,MICROSOFT,GITHUB}_CLIENT_{ID,SECRET}           (login providers; an unset pair disables that provider)
#   vars.AUTH_CUTOVER                                           (no longer read; safe to delete)
# The image is a public GHCR package, so nothing needs a registry credential at
# runtime and CI pushes it with GITHUB_TOKEN.
name: Deploy

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login
  contents: read
  packages: write # push the image to GHCR

env:
  RESOURCE_GROUP: rss-container-rg
  CONTAINER_APP: rss-reader-api
  SWA_NAME: rss-reader-swa
  IMAGE: ghcr.io/${{ github.repository_owner }}/rss-reader-api

jobs:
  # Catches a template ARM would refuse, before it reaches a deployment.
  validate:
    name: Validate template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate
        working-directory: infrastructure
        run: az deployment group validate --resource-group "$RESOURCE_GROUP" --template-file main.bicep --parameters main.bicepparam --parameters gatewaySecretKey="${{ secrets.GATEWAY_SECRET_KEY }}" --parameters googleClientId="${{ secrets.AUTH_GOOGLE_CLIENT_ID }}" googleClientSecret="${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}" microsoftClientId="${{ secrets.AUTH_MICROSOFT_CLIENT_ID }}" microsoftClientSecret="${{ secrets.AUTH_MICROSOFT_CLIENT_SECRET }}" githubClientId="${{ secrets.AUTH_GITHUB_CLIENT_ID }}" githubClientSecret="${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}" --query "properties.provisioningState" -o tsv
      - name: What-if
        working-directory: infrastructure
        run: az deployment group what-if --resource-group "$RESOURCE_GROUP" --template-file main.bicep --parameters main.bicepparam --parameters gatewaySecretKey="${{ secrets.GATEWAY_SECRET_KEY }}" --parameters googleClientId="${{ secrets.AUTH_GOOGLE_CLIENT_ID }}" googleClientSecret="${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}" microsoftClientId="${{ secrets.AUTH_MICROSOFT_CLIENT_ID }}" microsoftClientSecret="${{ secrets.AUTH_MICROSOFT_CLIENT_SECRET }}" githubClientId="${{ secrets.AUTH_GITHUB_CLIENT_ID }}" githubClientSecret="${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}"

  test:
    name: Build + test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # Excludes tests that fetch live third-party feeds: they fail on whether
      # someone else's server is up, which is not a signal worth blocking a
      # deploy on. Run them deliberately with --filter TestCategory=Network.
      - run: dotnet test test/RssReaderTests/RssReaderTests.csproj --filter "TestCategory!=Network" --logger "console;verbosity=minimal"

  backend:
    name: Backend
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit sha as well as latest. The sha tag is what gets
      # deployed, so every deploy is a distinct image reference -- which makes a
      # rollback just a re-run pinned to an older tag.
      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" -f src/Server/Dockerfile .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BLOB-DURABILITY-SPEC.md 9.4, "handover window": while the revision rolls, poll a
      # real endpoint on the live hostname once a second and record the longest run of
      # non-200 answers. Started here, read back after the health check below. Report
      # only for now (rollout step 3 measures the window across deploys); the 30 s
      # failure threshold comes in once the restore path is on and the baseline is known.
      - name: Start the handover probe
        run: |
          nohup bash -c '
            while [ ! -f /tmp/probe.stop ]; do
              user=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://api.rss.brandonchastain.com/api/user" || echo 000)
              hz=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://api.rss.brandonchastain.com/api/healthz" || echo 000)
              echo "$(date -u +%FT%T.%3NZ) $user $hz" >> /tmp/probe.log
              sleep 1
            done' >/dev/null 2>&1 &

      # The template deploys the container app. Never `az containerapp update`,
      # which drops the scale settings the template declares.
      - name: Deploy template with the new image
        working-directory: infrastructure
        run: az deployment group create --resource-group "$RESOURCE_GROUP" --template-file main.bicep --parameters main.bicepparam --parameters gatewaySecretKey="${{ secrets.GATEWAY_SECRET_KEY }}" --parameters googleClientId="${{ secrets.AUTH_GOOGLE_CLIENT_ID }}" googleClientSecret="${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}" microsoftClientId="${{ secrets.AUTH_MICROSOFT_CLIENT_ID }}" microsoftClientSecret="${{ secrets.AUTH_MICROSOFT_CLIENT_SECRET }}" githubClientId="${{ secrets.AUTH_GITHUB_CLIENT_ID }}" githubClientSecret="${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}" --parameters containerImage="$IMAGE:${{ github.sha }}" --query "properties.provisioningState" -o tsv

      # ARM reporting Succeeded does not mean the app came up: a revision can
      # fail activation and still hold all of the traffic. Ask the app itself.
      - name: Verify the backend is serving
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "https://api.rss.brandonchastain.com/api/healthz" || true)
            if [ "$code" = "200" ]; then echo "healthz OK on attempt $i"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "backend did not become healthy"
          exit 1

      # Longest run of non-200 answers on /api/user seen by the probe above, into the
      # job summary. /api/user answers 401 without a session, which is the real host
      # answering; only 5xx/000 count as the handover window. Rollout step 3's target
      # is a few seconds (BLOB-DURABILITY-SPEC.md 3.2 v2); the pre-step-3 value was ~61 s.
      - name: Report the handover window
        if: always()
        run: |
          touch /tmp/probe.stop; sleep 2
          [ -f /tmp/probe.log ] || { echo "no probe samples"; exit 0; }
          awk '
            { s=$2; down=(s>=500 || s=="000") }
            down && !indown { start=$1; indown=1; n=0 }
            down { n++; last=$1 }
            !down && indown { if (n>max) {max=n; mstart=start; mend=last}; indown=0 }
            END { if (indown && n>max) {max=n; mstart=start; mend=last}
                  printf "longest non-200 run: %d samples (%s .. %s) over %d samples\n", max, mstart, mend, NR }
          ' /tmp/probe.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo '<details><summary>probe samples (non-200 only)</summary>' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          awk '$2!=200 && $2!=401' /tmp/probe.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          echo '</details>' >> "$GITHUB_STEP_SUMMARY"

      - name: Report active revision
        if: always()
        run: az containerapp revision list --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query "[?properties.active].{name:name,traffic:properties.trafficWeight,state:properties.runningState,health:properties.healthState}" -o table

  frontend:
    name: Frontend
    needs: backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish the Blazor app
        run: dotnet publish src/WasmApp/WasmApp.csproj -c Release -o publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetched with the deploy identity rather than stored as another repo
      # secret -- one less long-lived credential to rotate or leak.
      - name: Get the Static Web Apps deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # The site is static only: the frontend talks to the API's own domain, and
      # an upload without api_location carries no managed functions.
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: publish/wwwroot
          output_location: ''
          skip_app_build: true

      - name: Verify the site is serving
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://rss.brandonchastain.com/" || true)
          echo "site: HTTP $code"
          [ "$code" = "200" ]

      # Both halves are live now. This proves the sign-in plumbing (login
      # redirects, the provider callback getting past the cross-site guard,
      # CORS, the frontend's API address) without needing an account; run it by
      # hand with the same command.
      - name: Smoke check sign-in and the cross-site guard
        run: bash .github/scripts/smoke-prod.sh
