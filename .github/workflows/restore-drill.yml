# Nightly restore drill (BLOB-DURABILITY-SPEC.md 9.5): the only proof a backup
# works is a restore, so one happens every day. Restores the production
# Litestream replica onto the runner with the deploy's OIDC identity (no key),
# runs quick_check, and compares row counts with the live /api/healthz.
#
# Committed with the schedule DISABLED (workflow_dispatch only) until rollout
# step 3, when the replica becomes authoritative; during steps 1 and 2 run it by
# hand to watch the shadow replica. To enable: uncomment the `schedule` block.
#
# Needs: the gh-actions-rss-reader identity to hold Storage Blob Data Reader (or
# Contributor) on the storage account. A federated credential for the
# `schedule`/`workflow_dispatch` subject on the main branch is already what the
# deploy's push-to-main job uses.
name: Restore drill

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 9 * * *'   # 09:17 UTC daily; enable at rollout step 3

permissions:
  id-token: write
  contents: read
  issues: write

env:
  RESOURCE_GROUP: rss-container-rg
  STORAGE_ACCOUNT: rssdatamoveqabxi4tro
  REPLICA_URL: abs://rssdatamoveqabxi4tro@litestream/storage.db
  HEALTHZ: https://api.rss.brandonchastain.com/api/healthz
  LITESTREAM_VERSION: 0.5.9
  # Rows the live writer may legitimately have added since the last sync (30 s)
  # plus the time this job takes to restore: the replica may lag the live counts
  # by this many posts before the drill calls it a divergence.
  ALLOWED_LAG_ROWS: 200

jobs:
  drill:
    name: Restore the replica and compare with production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Litestream and sqlite3
        run: |
          curl -fsSL "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz" | sudo tar -C /usr/local/bin -xz
          sudo apt-get update -q && sudo apt-get install -y -q sqlite3 jq >/dev/null
          litestream version

      # Litestream's abs replica falls through to the default Azure credential
      # chain when no key or SAS is set; azure/login leaves the CLI credential
      # that chain reads (verified in BLOB-DURABILITY-SPEC.md 11.1).
      - name: Restore the replica
        id: restore
        run: |
          t0=$(date +%s%N)
          litestream restore -o restored.db "$REPLICA_URL"
          ms=$(( ($(date +%s%N) - t0) / 1000000 ))
          bytes=$(stat -c %s restored.db)
          echo "restore_ms=$ms" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Restored $bytes bytes in $ms ms"

      - name: quick_check
        run: |
          qc=$(sqlite3 restored.db "PRAGMA quick_check")
          echo "quick_check: $qc"
          [ "$qc" = "ok" ]

      # The same SQL as DatabaseRowCounts.Sql in the app, so the two sides count
      # the same thing.
      - name: Compare row counts with the live writer
        id: compare
        run: |
          read -r r_posts r_subs r_ups r_max < <(sqlite3 -separator ' ' restored.db \
            "SELECT (SELECT count(*) FROM Posts), (SELECT count(*) FROM Subscriptions), (SELECT count(*) FROM UserPostState), (SELECT coalesce(max(Id),0) FROM Posts)")
          live=$(curl -fsS --max-time 30 "$HEALTHZ")
          l_posts=$(echo "$live" | jq -r '.rows.posts')
          l_subs=$(echo "$live" | jq -r '.rows.subscriptions')
          l_ups=$(echo "$live" | jq -r '.rows.userPostState')
          l_max=$(echo "$live" | jq -r '.rows.maxPostId')
          {
            echo "## Restore drill $(date -u +%F)"
            echo
            echo "| | Replica (restored) | Live /api/healthz | Difference |"
            echo "|---|---|---|---|"
            echo "| Posts | $r_posts | $l_posts | $((l_posts - r_posts)) |"
            echo "| Subscriptions | $r_subs | $l_subs | $((l_subs - r_subs)) |"
            echo "| UserPostState | $r_ups | $l_ups | $((l_ups - r_ups)) |"
            echo "| max(Posts.Id) | $r_max | $l_max | $((l_max - r_max)) |"
            echo
            echo "Restored ${{ steps.restore.outputs.bytes }} bytes in ${{ steps.restore.outputs.restore_ms }} ms; quick_check ok."
          } | tee -a "$GITHUB_STEP_SUMMARY" > summary.md
          # The live side may be a little ahead (writes since the last sync); it must
          # never be behind, and never ahead by more than the allowed lag. Retention
          # deletes make Posts shrink, so Posts is bounded in both directions.
          diverged=0
          abs() { echo "${1#-}"; }
          [ "$(abs $((l_posts - r_posts)))" -le "$ALLOWED_LAG_ROWS" ] || diverged=1
          [ "$(abs $((l_ups - r_ups)))" -le "$ALLOWED_LAG_ROWS" ] || diverged=1
          [ "$(abs $((l_subs - r_subs)))" -le 20 ] || diverged=1
          [ "$l_max" -ge "$r_max" ] || diverged=1
          [ $((l_max - r_max)) -le "$ALLOWED_LAG_ROWS" ] || diverged=1
          echo "diverged=$diverged" >> "$GITHUB_OUTPUT"
          [ "$diverged" = 0 ]

      - name: Open an issue on divergence or failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Restore drill failed $(date -u +%F)"
          body=$( [ -f summary.md ] && cat summary.md || echo "The restore or quick_check step failed; see the run." )
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --title "$title" --body "$(printf '%s\n\nRun: %s' "$body" "$run_url")" --label durability || true
