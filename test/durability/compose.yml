# Durability integration test (BLOB-DURABILITY-SPEC.md 9.2): the real image, the
# real Litestream binary and Azurite standing in for blob storage. Two writers,
# A and B, share the replica and the lease; run.sh starts and stops them per
# scenario. The replica is the only durable copy: a writer restores from it at
# startup and the blob must hold every acknowledged write.
name: rss-durability

x-writer: &writer
  image: ${RSS_IMAGE:-rss-reader-api:durability}
  volumes:
    - ./litestream.yml:/etc/litestream-test.yml:ro
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    RssAppConfig__IsTestUserEnabled: "true"
    RssAppConfig__SchedulerEnabled: "false"
    # NOT A SECRET: the AccountKey below is Azurite's published well-known test key for its
    # fake account devstoreaccount1 (see the Azurite README); it only works against the emulator.
    RssAppConfig__Durability__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    RssAppConfig__Durability__LeaseDuration: "00:00:15"
    RssAppConfig__Durability__LeaseRenewInterval: "00:00:05"
    RssAppConfig__Durability__LitestreamEnabled: "true"
    RssAppConfig__Durability__LitestreamConfigPath: /etc/litestream-test.yml
    # Startup restores from the replica. run.sh sets this to false only to bootstrap
    # an empty replica (a brand-new environment is given one by hand: a restore that
    # finds no replica must stop the container, never start an empty database).
    RssAppConfig__Durability__RestoreFromBlob: ${RSS_RESTORE_FROM_BLOB:-true}
    # An hour keeps a writer from answering the handoff marker, which stands in for an
    # old image that only releases on SIGTERM; run.sh sets it while creating writer A in
    # those scenarios and leaves it at 1 s for the cooperative one.
    RssAppConfig__Durability__HandoffPollInterval: ${RSS_HANDOFF_POLL:-00:00:01}
    Logging__LogLevel__Default: Information
  depends_on:
    azurite:
      condition: service_started

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000"

  writer-a:
    <<: *writer
    profiles: [a]
    ports:
      - "18081:8080"
    stop_grace_period: 60s

  writer-b:
    <<: *writer
    profiles: [b]
    ports:
      - "18082:8080"
    stop_grace_period: 60s

