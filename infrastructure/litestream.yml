# Litestream 0.5.9 configuration: continuous replication of the live SQLite
# database to Azure Blob Storage (BLOB-DURABILITY-SPEC.md 3.5, verified in 11.5).
#
# Started by the app (LitestreamSupervisor) once /tmp/storage.db is in place.
# Rollout steps 1 and 2: a shadow of the Azure Files backup. Rollout step 3
# (RssAppConfig:Durability:RestoreFromBlob, default off) restores from this
# replica at boot with `litestream restore -config /etc/litestream.yml`.
#
# Auth, in Litestream's order: LITESTREAM_AZURE_SAS_TOKEN, then account-key /
# LITESTREAM_AZURE_ACCOUNT_KEY, then the default Azure credential chain, which
# in Container Apps is the app's system-assigned managed identity (11.1). No
# key is set here on purpose.
#
# Key names are the 0.5 ones. 0.5.9 ignores unknown keys silently (11.5), so a
# replica-level `retention` or `snapshot-interval` would be a no-op.

# Control socket for `litestream sync -wait` from the app on shutdown (3.3 step 4).
socket:
  enabled: true
  path: /tmp/litestream.sock

# Full snapshot hourly; keep snapshots (and so point-in-time restore) for 3 h.
# Why hourly: after every restart Litestream's first upload is a full-database file
# (it has no position in the replica), and each compaction level merges ranges that
# contain it. A restore reads the newest snapshot plus every file since, so an hourly
# snapshot bounds the chain to one snapshot plus the restarts of the last hour.
# Why 3 h retention: everything older than the oldest kept snapshot is deleted, and each
# snapshot and each restart's full copy is a whole database (~230 MB). At 24 h retention
# the replica held 23 snapshots and 9 restart copies, 8.7 GB for a 326 MB database
# (2026-10-26); at 3 h it holds about three snapshots (the newest is always kept, older
# ones go once past retention, db.go EnforceSnapshotRetention) plus the tail since the
# last deleted snapshot, roughly 0.9 to 1.4 GB. The cost is the recovery window: an
# operator can restore to any point in the last three to four hours, not the last day. There is no other copy of the
# database since the Azure Files share went away, so take a manual copy (`VACUUM INTO`
# through `az containerapp exec`) before a risky migration.
snapshot:
  interval: 1h
  retention: 3h

# LTX compaction: L1 only, every 30 s. L0 files are kept 5 min (l0-retention
# default). A restore reads the newest snapshot plus the L0 and L1 files since it,
# and the hourly snapshot keeps that tail to an hour.
#
# L1 stays at 30 s although uploads are every 30 min (sync-interval below): with the
# listing bug described next, each L1 compaction takes exactly one L0 file, so L1
# must run more often than new transactions arrive (about one a minute) or it falls
# behind for good and L0 is never cleaned up. With nothing new uploaded, a run is
# one small listing.
#
# No L2 (5 min) or L3 (1 h): they never worked on Azure in 0.5.17. Its blob listing
# uses the seek txid as a name prefix, so a compaction reads at most the one L1 file
# whose name starts with exactly that txid, and nothing once retention has deleted
# it (litestream#1456, fixed on main by #1461, not in a release yet). Here L2 and
# L3 crawled one txid per run from 2026-10-25 and stopped for good at txid 299 and
# 35 on 2026-10-26 02:30 UTC. Add them back once the release with #1461 ships.
levels:
  - interval: 30s

# How often old L0 files are looked for and deleted (default 15 s). Each check
# lists the replica; with 30-minute uploads there is rarely anything to delete.
l0-retention-check-interval: 5m

# Litestream's own final sync when it is told to stop: retry for up to 30 s.
shutdown-sync-timeout: 30s

dbs:
  - path: /tmp/storage.db
    replica:
      type: abs
      account-name: ${LITESTREAM_AZURE_ACCOUNT_NAME}
      bucket: litestream
      # storage-v2.db: a fresh replica path (2026-10-25). The old `storage.db` prefix held a
      # 4.8 GB chain (172 L1 files, 21 full-database copies) and level 2 and 3 never wrote a
      # file. The suspect was stale April files in its ltx/2 and ltx/3; the real cause is the
      # listing bug under `levels` above, which the new path did not escape. The old prefix
      # has since been deleted. The first deploy on the new path
      # finds no replica, so its follower fails and it seeds from the share (the 7 s path);
      # replication then starts the new chain with a snapshot.
      path: storage-v2.db
      # Upload cadence, and so the recovery point on a hard crash (OOM kill, node loss):
      # up to this much of the latest writes is lost. Deploys and platform replica moves
      # lose nothing either way, because the old writer runs a final sync before it hands
      # over. Set by LITESTREAM_SYNC_INTERVAL (image default in src/Server/Dockerfile,
      # production value in infrastructure/main.bicep). 30 min since 2026-11-03 (1 h for a
      # day before that), for cost: at
      # 30 s the replica made about 21,000 blob listings a day (~$3/month) and was
      # rarely idle for Container Apps billing. 1 s (the default) was the 2026-05
      # write-operation cost.
      sync-interval: ${LITESTREAM_SYNC_INTERVAL}
